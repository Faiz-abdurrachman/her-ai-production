<div class="dashboard-layout">
    <div id="sidebar-container"></div>
    <main class="main-content">
        <div class="progress-peserta-premium-scope">
            <style>
                .progress-peserta-premium-scope {
                    --wit-navy: #11194F;
                    --wit-navy-light: #2A3166;
                    --wit-slate: #61698F;
                    --wit-pink: #FF2F8A;
                    --wit-pink-readable: #B31F61;
                    --wit-pink-soft: #FF8FC4;
                    --wit-lavender: #B79CFF;
                    --wit-pale: #FDF4F8;
                    --wit-surface: #FFFCFD;
                    --wit-surface-muted: #FBF7FA;
                    --wit-border: #EADFE6;
                    --wit-track: #EEE7EB;
                    --wit-success: #19704A;
                    --wit-success-soft: #E9F6EF;
                    --wit-neutral: #59617E;
                    --wit-neutral-soft: #F0F1F5;
                    --wit-glass-surface: rgba(255, 255, 255, 0.6);
                    --wit-glass-border: rgba(255, 255, 255, 0.4);
                    --wit-glass-shadow: 0 15px 40px rgba(255, 143, 196, 0.08);
                    
                    position: relative;
                    min-height: 100%;
                    padding: 32px;
                    font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
                    background: linear-gradient(135deg, #FFF5F8 0%, #FAF0F5 100%);
                    overflow: hidden; /* Prevent blurs from causing scrollbars */
                }

                /* Decorative Background Elements */
                .progress-peserta-premium-scope::before,
                .progress-peserta-premium-scope::after {
                    content: '';
                    position: absolute;
                    pointer-events: none;
                    z-index: -1;
                    border-radius: 50%;
                    filter: blur(120px); /* This makes the colors blend perfectly */
                }
                .progress-peserta-premium-scope::before {
                    top: -10%;
                    left: -10%;
                    width: 700px;
                    height: 700px;
                    background: rgba(255, 214, 227, 0.8);
                }
                .progress-peserta-premium-scope::after {
                    bottom: -10%;
                    right: -10%;
                    width: 800px;
                    height: 800px;
                    background: rgba(255, 143, 196, 0.35);
                }

                /* Header */
                .premium-header {
                    background: var(--wit-glass-surface);
                    backdrop-filter: blur(24px) saturate(135%);
                    -webkit-backdrop-filter: blur(24px) saturate(135%);
                    border: 1px solid var(--wit-glass-border);
                    box-shadow: var(--wit-glass-shadow), inset 0 1px 0 rgba(255,255,255,0.8);
                    border-radius: 28px;
                    padding: 24px 32px;
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    margin-bottom: 24px;
                    position: relative;
                    overflow: hidden;
                }
                
                .premium-header-left h1 {
                    color: var(--wit-navy);
                    font-size: 28px;
                    font-weight: 700;
                    margin: 0 0 4px 0;
                }
                .premium-header-left p {
                    color: var(--wit-slate);
                    font-size: 14px;
                    margin: 0;
                }

                .premium-header-right {
                    display: flex;
                    align-items: center;
                    gap: 16px;
                }

                .progress-peserta-premium-scope .btn-refresh {
                    background: linear-gradient(135deg, var(--wit-pink), #ff5e8e);
                    color: white;
                    border: none;
                    border-radius: 999px;
                    min-height: 44px;
                    padding: 10px 24px;
                    font-weight: 600;
                    font-size: 14px;
                    display: flex;
                    align-items: center;
                    gap: 8px;
                    box-shadow: 0 8px 20px rgba(255, 47, 138, 0.3);
                    cursor: pointer;
                    transition: all 0.2s;
                }
                .progress-peserta-premium-scope .btn-refresh:hover:not(:disabled) {
                    transform: translateY(-2px);
                    box-shadow: 0 12px 25px rgba(255, 47, 138, 0.4);
                }

                .progress-peserta-premium-scope .btn-refresh:disabled {
                    cursor: wait;
                    opacity: 0.72;
                }

                /* Summary Cards */
                .premium-summary-grid {
                    display: grid;
                    grid-template-columns: repeat(3, 1fr);
                    gap: 16px;
                    margin-bottom: 28px;
                }

                .premium-summary-card {
                    background: var(--wit-glass-surface);
                    backdrop-filter: blur(24px) saturate(135%);
                    -webkit-backdrop-filter: blur(24px) saturate(135%);
                    border: 1px solid var(--wit-glass-border);
                    box-shadow: var(--wit-glass-shadow), inset 0 1px 0 rgba(255,255,255,0.8);
                    border-radius: 24px;
                    padding: 24px;
                    display: flex;
                    align-items: center;
                    gap: 20px;
                    position: relative;
                }
                
                .premium-summary-icon {
                    width: 56px;
                    height: 56px;
                    border-radius: 50%;
                    background: linear-gradient(135deg, rgba(255,143,196,0.2), rgba(183,156,255,0.2));
                    border: 1px solid rgba(255,255,255,0.6);
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    color: var(--wit-pink-readable);
                    font-size: 24px;
                    box-shadow: inset 0 4px 10px rgba(255,255,255,0.5);
                }
                
                .premium-summary-content h4 {
                    margin: 0 0 4px 0;
                    color: var(--wit-navy);
                    font-weight: 600;
                    font-size: 14px;
                }
                .premium-summary-content .main-val {
                    margin: 0;
                    color: var(--wit-navy);
                    font-weight: 800;
                    font-size: 32px;
                    line-height: 1.1;
                }
                .premium-summary-content .main-val.pink-text {
                    color: var(--wit-pink);
                }
                .premium-summary-content p {
                    margin: 4px 0 0 0;
                    color: var(--wit-slate);
                    font-size: 13px;
                }
                .premium-summary-badge {
                    background: rgba(255, 47, 138, 0.1);
                    color: var(--wit-pink-readable);
                    padding: 4px 10px;
                    border-radius: 12px;
                    font-size: 12px;
                    font-weight: 700;
                    margin-left: 10px;
                }

                /* Table Container */
                .premium-table-container {
                    background: rgba(255, 252, 253, 0.94);
                    border: 1px solid var(--wit-border);
                    box-shadow: 0 18px 48px rgba(66, 27, 53, 0.08);
                    border-radius: 28px;
                    padding: 28px;
                }

                .premium-table-header {
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    margin-bottom: 24px;
                }
                .premium-table-header h2 {
                    margin: 0;
                    color: var(--wit-navy);
                    font-weight: 700;
                    font-size: 20px;
                }
                .progress-peserta-premium-scope .snapshot-status {
                    color: var(--wit-slate);
                    font-size: 12px;
                    margin: 5px 0 0;
                }

                .premium-search {
                    position: relative;
                    width: 300px;
                }
                .premium-search input {
                    width: 100%;
                    background: rgba(255,255,255,0.6);
                    border: 1px solid var(--wit-glass-border);
                    padding: 10px 16px 10px 40px;
                    min-height: 44px;
                    border-radius: 999px;
                    color: var(--wit-navy);
                    font-size: 14px;
                    outline: none;
                    box-shadow: inset 0 2px 5px rgba(0,0,0,0.02);
                    transition: border-color 0.2s;
                }
                .premium-search input:focus {
                    border-color: var(--wit-pink-soft);
                }
                .premium-search i {
                    position: absolute;
                    left: 14px;
                    top: 50%;
                    transform: translateY(-50%);
                    color: var(--wit-slate);
                    opacity: 0.7;
                }

                /* Table Design */
                .premium-table-scroll {
                    max-width: 100%;
                    overflow-x: auto;
                    border: 1px solid var(--wit-border);
                    border-radius: 18px;
                    background: var(--wit-surface);
                }
                .premium-table {
                    width: 100%;
                    min-width: 680px;
                    border-collapse: collapse;
                    table-layout: fixed;
                }
                .premium-table th {
                    text-align: left;
                    padding: 14px 18px;
                    color: var(--wit-navy-light);
                    background: var(--wit-surface-muted);
                    font-weight: 700;
                    font-size: 13px;
                    line-height: 1.4;
                    border-bottom: 1px solid var(--wit-border);
                    position: sticky;
                    top: 0;
                    z-index: 1;
                }
                .premium-table td {
                    padding: 18px;
                    vertical-align: middle;
                    border-bottom: 1px solid var(--wit-border);
                    background: var(--wit-surface);
                    transition: background-color 0.18s ease;
                }
                .premium-table tbody tr:last-child td {
                    border-bottom: 0;
                }
                .premium-table th:last-child,
                .premium-table td:last-child {
                    padding-left: 12px;
                    padding-right: 12px;
                }
                .premium-table tr:hover td {
                    background: #FFF8FB;
                }

                /* Rows Styling */
                .participant-identity {
                    display: flex;
                    align-items: center;
                    gap: 12px;
                }
                .participant-avatar {
                    width: 42px;
                    height: 42px;
                    flex: 0 0 42px;
                    border-radius: 50%;
                    background: var(--wit-pale);
                    color: var(--wit-pink-readable);
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    font-weight: 700;
                    font-size: 14px;
                }
                .participant-name {
                    font-weight: 600;
                    color: var(--wit-navy);
                    font-size: 14px;
                    line-height: 1.5;
                }
                .participant-name-row {
                    display: flex;
                    align-items: center;
                    flex-wrap: wrap;
                    gap: 8px;
                }
                .qa-badge {
                    display: inline-flex;
                    align-items: center;
                    min-height: 24px;
                    padding: 3px 8px;
                    border: 1px solid #9F7AEA;
                    border-radius: 999px;
                    background: #F4EFFF;
                    color: #5B32A3;
                    font-size: 10px;
                    font-weight: 800;
                    letter-spacing: 0.05em;
                }
                .qa-participant-row td:first-child {
                    box-shadow: inset 3px 0 0 #9F7AEA;
                }

                .progress-track {
                    background: var(--wit-track);
                    height: 8px;
                    border-radius: 999px;
                    width: 100%;
                    overflow: hidden;
                }
                .progress-fill {
                    background: linear-gradient(90deg, var(--wit-pink), #ff5e8e);
                    height: 100%;
                    border-radius: 999px;
                }

                .overall-progress-cell {
                    min-width: 280px;
                }
                .overall-progress-heading {
                    display: flex;
                    align-items: center;
                    justify-content: space-between;
                    gap: 12px;
                    margin-bottom: 10px;
                }
                .overall-progress-value {
                    color: var(--wit-pink);
                    font-size: 20px;
                    font-weight: 800;
                    line-height: 1;
                    font-variant-numeric: tabular-nums;
                }
                .progress-state-label {
                    display: inline-flex;
                    align-items: center;
                    min-height: 28px;
                    padding: 4px 10px;
                    border-radius: 999px;
                    background: rgba(255, 47, 138, 0.09);
                    color: #B31F61;
                    font-size: 11px;
                    font-weight: 700;
                    white-space: nowrap;
                }
                .overall-progress-meta,
                .participant-meta {
                    display: block;
                    margin-top: 8px;
                    color: var(--wit-neutral);
                    font-size: 12px;
                    line-height: 1.45;
                }
                .participant-meta {
                    margin-top: 3px;
                    font-variant-numeric: tabular-nums;
                }
                .overall-progress[data-progress-state="empty"] .overall-progress-value {
                    color: var(--wit-neutral);
                }
                .overall-progress[data-progress-state="empty"] .progress-state-label {
                    background: var(--wit-neutral-soft);
                    color: #4D5673;
                }
                .overall-progress[data-progress-state="empty"] .progress-fill {
                    background: var(--wit-neutral);
                }
                .overall-progress[data-progress-state="complete"] .overall-progress-value {
                    color: var(--wit-success);
                }
                .overall-progress[data-progress-state="complete"] .progress-state-label {
                    background: var(--wit-success-soft);
                    color: var(--wit-success);
                }
                .overall-progress[data-progress-state="complete"] .progress-fill {
                    background: var(--wit-success);
                }

                .last-active {
                    color: var(--wit-navy-light);
                }
                .last-active-primary {
                    display: flex;
                    align-items: center;
                    gap: 8px;
                    color: var(--wit-navy-light);
                    font-size: 13px;
                    font-weight: 700;
                    line-height: 1.45;
                }
                .last-active-primary i {
                    width: 16px;
                    color: var(--wit-pink);
                    text-align: center;
                }
                .last-active-exact {
                    display: block;
                    margin-top: 5px;
                    color: var(--wit-neutral);
                    font-size: 12px;
                    line-height: 1.45;
                    font-variant-numeric: tabular-nums;
                }
                .last-active-empty .last-active-primary,
                .last-active-empty .last-active-primary i {
                    color: var(--wit-neutral);
                }

                .btn-detail {
                    display: inline-flex;
                    align-items: center;
                    justify-content: center;
                    gap: 8px;
                    background: rgba(255, 47, 138, 0.08);
                    border: 1px solid rgba(179, 31, 97, 0.28);
                    color: var(--wit-pink-readable);
                    min-height: 44px;
                    padding: 8px 12px;
                    border-radius: 999px;
                    font-size: 13px;
                    font-weight: 600;
                    cursor: pointer;
                    transition: all 0.2s;
                }
                .btn-detail:hover {
                    background: rgba(255, 47, 138, 0.15);
                    transform: translateY(-1px);
                }
                .btn-detail i {
                    font-size: 11px;
                }
                .progress-peserta-premium-scope .progress-error {
                    display: none;
                    margin: 0 0 18px;
                    padding: 14px 16px;
                    border: 1px solid rgba(190, 24, 93, 0.22);
                    border-radius: 14px;
                    background: rgba(255, 47, 138, 0.07);
                    color: #8f174e;
                    font-size: 13px;
                }

                /* Pagination */
                .premium-pagination {
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    margin-top: 24px;
                    padding-top: 16px;
                }
                .pagination-info {
                    color: var(--wit-slate);
                    font-size: 13px;
                }
                .pagination-controls {
                    display: flex;
                    gap: 6px;
                    align-items: center;
                }
                .page-btn {
                    min-width: 44px;
                    height: 44px;
                    border-radius: 8px;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    background: rgba(255,255,255,0.5);
                    border: 1px solid var(--wit-glass-border);
                    color: var(--wit-navy);
                    font-size: 13px;
                    font-weight: 600;
                    cursor: pointer;
                    transition: all 0.2s;
                }
                .page-btn:hover:not(:disabled) {
                    background: rgba(255,255,255,0.8);
                }
                .page-btn.active {
                    background: var(--wit-pink);
                    color: white;
                    border-color: var(--wit-pink);
                    box-shadow: 0 4px 10px rgba(255, 47, 138, 0.3);
                }
                .page-btn:disabled {
                    opacity: 0.5;
                    cursor: not-allowed;
                }
                .progress-peserta-premium-scope .btn-refresh:focus-visible,
                .progress-peserta-premium-scope .btn-detail:focus-visible,
                .progress-peserta-premium-scope .page-btn:focus-visible,
                .progress-peserta-premium-scope .premium-search input:focus-visible {
                    outline: 3px solid rgba(255, 47, 138, 0.28);
                    outline-offset: 2px;
                }
                .progress-peserta-premium-scope .sr-only {
                    position: absolute;
                    width: 1px;
                    height: 1px;
                    padding: 0;
                    margin: -1px;
                    overflow: hidden;
                    clip: rect(0, 0, 0, 0);
                    white-space: nowrap;
                    border: 0;
                }

                /* Responsive */
                @media (max-width: 1024px) {
                    .premium-summary-grid {
                        grid-template-columns: repeat(2, 1fr);
                    }
                }
                @media (max-width: 768px) {
                    .progress-peserta-premium-scope {
                        padding: 16px;
                    }
                    .premium-header {
                        flex-direction: column;
                        gap: 16px;
                        align-items: flex-start;
                    }
                    .premium-summary-grid {
                        grid-template-columns: 1fr;
                    }
                    .premium-table-header {
                        flex-direction: column;
                        gap: 16px;
                        align-items: flex-start;
                    }
                    .premium-search {
                        width: 100%;
                    }
                    .premium-table-container {
                        padding: 18px;
                    }
                    .premium-table-scroll {
                        overflow: visible;
                        border: 0;
                        border-radius: 0;
                        background: transparent;
                    }
                    .premium-table {
                        min-width: 0;
                        display: block;
                        box-sizing: border-box;
                    }
                    .premium-table colgroup {
                        display: none;
                    }
                    .premium-table thead {
                        position: absolute;
                        width: 1px;
                        height: 1px;
                        padding: 0;
                        margin: -1px;
                        overflow: hidden;
                        clip: rect(0, 0, 0, 0);
                        white-space: nowrap;
                        border: 0;
                    }
                    .premium-table tbody {
                        display: grid;
                        gap: 12px;
                        width: 100%;
                        box-sizing: border-box;
                    }
                    .premium-table tbody tr {
                        display: block;
                        width: 100%;
                        padding: 16px;
                        border: 1px solid var(--wit-border);
                        border-radius: 18px;
                        background: var(--wit-surface);
                        box-shadow: 0 8px 22px rgba(66, 27, 53, 0.05);
                        box-sizing: border-box;
                    }
                    .premium-table tbody tr.qa-participant-row {
                        border-color: #CDBDF5;
                    }
                    .premium-table td {
                        display: block;
                        width: auto;
                        padding: 10px 0;
                        border: 0;
                        background: transparent;
                        box-sizing: border-box;
                    }
                    .premium-table tr:hover td {
                        background: transparent;
                    }
                    .premium-table td[data-label]::before {
                        content: attr(data-label);
                        display: block;
                        margin-bottom: 8px;
                        color: var(--wit-neutral);
                        font-size: 11px;
                        font-weight: 700;
                        letter-spacing: 0.04em;
                        text-transform: uppercase;
                    }
                    .premium-table td:first-child {
                        padding-top: 0;
                        padding-bottom: 14px;
                        border-bottom: 1px solid var(--wit-border);
                    }
                    .premium-table td:last-child {
                        padding-bottom: 0;
                    }
                    .overall-progress-cell {
                        min-width: 0;
                    }
                    .btn-detail {
                        width: 100%;
                    }
                }
                @media (prefers-reduced-motion: reduce) {
                    .progress-peserta-premium-scope *,
                    .progress-peserta-premium-scope *::before,
                    .progress-peserta-premium-scope *::after {
                        scroll-behavior: auto !important;
                        transition-duration: 0.01ms !important;
                        animation-duration: 0.01ms !important;
                        animation-iteration-count: 1 !important;
                    }
                }
            </style>

            <div style="position: absolute; bottom: 15%; left: 5%; width: 350px; height: 350px; background: rgba(183, 156, 255, 0.3); filter: blur(120px); pointer-events: none; z-index: -1; border-radius: 50%;"></div>
