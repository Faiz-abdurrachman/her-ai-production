<div class="dashboard-layout">

    <div id="sidebar-container"></div>

    <main class="main-content">

        <header class="topbar">
            <div class="topbar-left">
                <h1 class="page-title" id="live-header-title">Live Monitor</h1>
                <p class="page-subtitle" id="live-header-sub">Pemantauan aktivitas peserta secara real-time</p>
            </div>
            <div class="topbar-right">
                <div class="admin-profile">
                    <div class="admin-info">
                        <h4 id="display-admin-name">Admin</h4>
                        <p id="display-admin-id">Admin Access</p>
                    </div>
                    <div class="admin-avatar avatar-pink">
                        <i class="fas fa-satellite-dish"></i>
                    </div>
                </div>
            </div>
        </header>

        <div class="live-monitor-shell">

            <!-- Quick date presets -->
            <div class="lm-presets" role="group" aria-label="Filter cepat tanggal">
                <button type="button" class="lm-preset" data-preset="today"><i class="fas fa-bolt"></i> Hari Ini</button>
                <button type="button" class="lm-preset" data-preset="7d"><i class="fas fa-calendar-week"></i> 7 Hari</button>
                <button type="button" class="lm-preset" data-preset="30d"><i class="fas fa-calendar-days"></i> 30 Hari</button>
                <button type="button" class="lm-preset" data-preset="month"><i class="fas fa-calendar"></i> Bulan Ini</button>
            </div>

            <div class="live-monitor-controlbar">
                <div class="lmc-section lmc-filters">
                    <div class="lmc-field">
                        <label class="lmc-label" for="live-filter-from">
                            <i class="fas fa-calendar-day"></i> Dari
                        </label>
                        <input type="date" id="live-filter-from" class="lmc-date" />
                    </div>
                    <span class="lmc-arrow"><i class="fas fa-long-arrow-alt-right"></i></span>
                    <div class="lmc-field">
                        <label class="lmc-label" for="live-filter-to">
                            <i class="fas fa-calendar-check"></i> Sampai
                        </label>
                        <input type="date" id="live-filter-to" class="lmc-date" />
                    </div>
                    <button type="button" id="live-filter-apply" class="lmc-apply">
                        <i class="fas fa-filter"></i> Filter
                    </button>
                    <button type="button" id="live-filter-reset" class="lmc-reset">
                        <i class="fas fa-rotate-left"></i> Reset
                    </button>
                </div>
                <div class="lmc-section lmc-meta">
                    <span class="lmc-pulse" title="Sedang memantau">
                        <span class="lmc-pulse-dot"></span>
                        <span id="live-poll-status">Live</span>
                    </span>
                    <span class="lmc-count" id="live-result-count">0 aktivitas</span>
                </div>
            </div>

            <!-- Active filter indicator (rendered by JS) -->
            <div class="lm-active-filter" id="live-active-filter" hidden>
                <span class="lm-active-filter-icon"><i class="fas fa-filter-circle-check"></i></span>
                <span class="lm-active-filter-text" id="live-active-filter-text"></span>
                <button type="button" class="lm-active-filter-clear" id="live-active-filter-clear" title="Hapus filter">
                    <i class="fas fa-xmark"></i> Hapus Filter
                </button>
            </div>

            <div class="live-monitor-grid">

                <section class="glass-panel live-online-panel">
                    <div class="panel-header panel-header-border live-online-head">
                        <h3 class="panel-title" id="live-online-title">
                            <i class="fas fa-dot-circle icon-green"></i> Peserta Online
                        </h3>
                        <span class="live-monitor-badge" id="live-online-badge">0 online</span>
                    </div>
                    <div class="panel-body" id="live-online-presence">
                        <!-- skeleton rendered by JS -->
                    </div>
                </section>

                <section class="glass-panel live-feed-panel">
                    <div class="panel-header panel-header-border live-feed-head">
                        <h3 class="panel-title">
                            <i class="fas fa-stream icon-blue"></i> Aktivitas Terbaru
                        </h3>
                        <div class="live-feed-filter">
                            <select id="live-feed-filter-nik" class="live-filter-select" aria-label="Filter peserta">
                                <option value="">Semua Peserta</option>
                            </select>
                        </div>
                    </div>
                    <div class="panel-body" id="live-activity-feed">
                        <!-- skeleton rendered by JS -->
                    </div>
                </section>

            </div>

        </div>

    </main>

</div>
