<div class="dashboard-layout">
    <div id="sidebar-container"></div>
    <main class="main-content">
        <div class="live-monitor-premium-scope">
            <style>
                .live-monitor-premium-scope {
                    --wit-navy: #11194F;
                    --wit-navy-light: #2A3166;
                    --wit-slate: #61698F;
                    --wit-pink: #FF2F8A;
                    --wit-pink-soft: #FF8FC4;
                    --wit-lavender: #B79CFF;
                    --wit-pale: #FDF4F8;
                    --wit-glass-surface: rgba(255, 255, 255, 0.6);
                    --wit-glass-border: rgba(255, 255, 255, 0.4);
                    --wit-glass-shadow: 0 15px 40px rgba(255, 143, 196, 0.08);
                    
                    position: relative;
                    min-height: 100%;
                    padding: 32px;
                    font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
                    background: linear-gradient(135deg, #FFF5F8 0%, #FAF0F5 100%);
                    overflow: hidden;
                    color: var(--wit-navy);
                }

                /* Decorative Ambience elements */
                .live-monitor-premium-scope::before,
                .live-monitor-premium-scope::after {
                    content: '';
                    position: absolute;
                    pointer-events: none;
                    z-index: -1;
                    border-radius: 50%;
                    filter: blur(120px);
                }
                .live-monitor-premium-scope::before {
                    top: -10%;
                    left: -10%;
                    width: 700px;
                    height: 700px;
                    background: rgba(255, 214, 227, 0.8);
                }
                .live-monitor-premium-scope::after {
                    bottom: -10%;
                    right: -10%;
                    width: 800px;
                    height: 800px;
                    background: rgba(255, 143, 196, 0.35);
                }

                .ambience-1 {
                    position: absolute; top: 25%; right: 8%; width: 250px; height: 250px; background: rgba(255, 143, 196, 0.4); filter: blur(90px); pointer-events: none; z-index: -1; border-radius: 50%;
                }
                .ambience-2 {
                    position: absolute; bottom: 15%; left: 5%; width: 350px; height: 350px; background: rgba(183, 156, 255, 0.3); filter: blur(120px); pointer-events: none; z-index: -1; border-radius: 50%;
                }

                /* Header */
                .premium-topbar {
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    margin-bottom: 32px;
                    padding-bottom: 24px;
                    border-bottom: 1px solid rgba(255, 105, 180, 0.1);
                }
                .premium-title h1 {
                    margin: 0;
                    color: var(--wit-navy);
                    font-size: 28px;
                    font-weight: 800;
                    letter-spacing: -0.5px;
                }
                .premium-title p {
                    margin: 8px 0 0;
                    color: var(--wit-slate);
                    font-size: 15px;
                }
                .premium-admin-chip {
                    display: flex;
                    align-items: center;
                    gap: 12px;
                    background: rgba(255, 255, 255, 0.8);
                    border: 1px solid var(--wit-glass-border);
                    padding: 10px 20px;
                    border-radius: 999px;
                    box-shadow: 0 5px 15px rgba(255, 143, 196, 0.1);
                    backdrop-filter: blur(10px);
                }
                .premium-admin-chip .admin-info {
                    text-align: right;
                }
                .premium-admin-chip h4 {
                    margin: 0; font-size: 14px; font-weight: 700; color: var(--wit-navy);
                }
                .premium-admin-chip p {
                    margin: 0; font-size: 12px; color: var(--wit-slate);
                }
                .premium-admin-chip .avatar-pink {
                    width: 36px; height: 36px; border-radius: 50%; background: #FFD6E8; color: var(--wit-pink); display: flex; align-items: center; justify-content: center; font-size: 14px;
                }

                /* Controls Layout */
                .premium-controls {
                    display: flex;
                    flex-direction: column;
                    gap: 20px;
                    margin-bottom: 32px;
                }
                .lm-presets {
                    display: flex;
                    gap: 12px;
                }
                .lm-preset {
                    background: rgba(255, 255, 255, 0.6);
                    border: 1px solid var(--wit-glass-border);
                    padding: 10px 20px;
                    border-radius: 999px;
                    color: var(--wit-navy);
                    font-size: 14px;
                    font-weight: 600;
                    cursor: pointer;
                    transition: all 0.2s;
                    backdrop-filter: blur(10px);
                }
                .lm-preset:hover, .lm-preset.active {
                    background: var(--wit-pink);
                    color: white;
                    border-color: var(--wit-pink);
                    box-shadow: 0 4px 15px rgba(255, 47, 138, 0.25);
                }
                
                .live-monitor-controlbar {
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    background: var(--wit-glass-surface);
                    backdrop-filter: blur(20px);
                    -webkit-backdrop-filter: blur(20px);
                    border: 1px solid var(--wit-glass-border);
                    box-shadow: var(--wit-glass-shadow);
                    border-radius: 999px;
                    padding: 10px 24px;
                }
                .lmc-filters {
                    display: flex;
                    align-items: center;
                    gap: 16px;
                }
                .lmc-field {
                    display: flex;
                    align-items: center;
                    gap: 8px;
                }
                .lmc-label {
                    font-size: 13px;
                    font-weight: 700;
                    color: var(--wit-pink);
                    text-transform: uppercase;
                    letter-spacing: 0.5px;
                }
                .lmc-date {
                    border: none;
                    background: transparent;
                    color: var(--wit-navy);
                    font-size: 14px;
                    font-family: inherit;
                    font-weight: 600;
                    outline: none;
                }
                .lmc-arrow {
                    color: var(--wit-pink-soft);
                }
                .lmc-apply {
                    background: linear-gradient(90deg, var(--wit-pink), #ff5e8e);
                    color: white;
                    border: none;
                    padding: 8px 20px;
                    border-radius: 999px;
                    font-weight: 600;
                    cursor: pointer;
                    box-shadow: 0 4px 12px rgba(255, 47, 138, 0.3);
                }
                .lmc-reset {
                    background: rgba(255, 47, 138, 0.08);
                    color: var(--wit-pink);
                    border: none;
                    padding: 8px 20px;
                    border-radius: 999px;
                    font-weight: 600;
                    cursor: pointer;
                }
                
                .lmc-meta {
                    display: flex;
                    align-items: center;
                    gap: 12px;
                }
                .lmc-pulse {
                    display: flex; align-items: center; gap: 6px;
                    background: rgba(255, 47, 138, 0.08);
                    padding: 6px 12px;
                    border-radius: 999px;
                    color: var(--wit-pink);
                    font-weight: 700;
                    font-size: 13px;
                }
                .lmc-pulse-dot {
                    width: 8px; height: 8px; border-radius: 50%; background: var(--wit-pink);
                }
                .lmc-pulse-dot.is-busy {
                    animation: pulse 1s infinite alternate;
                }
                @keyframes pulse { from { opacity: 0.4; } to { opacity: 1; } }
                .lmc-count {
                    background: rgba(255,255,255,0.8);
                    padding: 6px 16px;
                    border-radius: 999px;
                    font-weight: 600;
                    font-size: 13px;
                    color: var(--wit-slate);
                    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
                }

                /* Grid Layout */
                .live-monitor-grid {
                    display: grid;
                    grid-template-columns: 350px 1fr;
                    gap: 24px;
                }
                .glass-panel {
                    background: var(--wit-glass-surface);
                    backdrop-filter: blur(20px);
                    -webkit-backdrop-filter: blur(20px);
                    border: 1px solid var(--wit-glass-border);
                    box-shadow: var(--wit-glass-shadow);
                    border-radius: 24px;
                    overflow: hidden;
                    display: flex;
                    flex-direction: column;
                }
                .panel-header {
                    padding: 24px;
                    border-bottom: 1px solid rgba(255, 105, 180, 0.1);
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                }
                .panel-title {
                    margin: 0; font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 10px;
                }
                .panel-title i {
                    font-size: 20px;
                }
                .icon-green { color: #00E676; }
                .icon-blue { color: var(--wit-lavender); }
                .live-monitor-badge {
                    background: linear-gradient(90deg, var(--wit-pink), #ff5e8e);
                    color: white;
                    padding: 6px 16px;
                    border-radius: 999px;
                    font-size: 13px;
                    font-weight: 700;
                    box-shadow: 0 4px 10px rgba(255,47,138,0.3);
                }
                
                .live-filter-select {
                    background: rgba(255,255,255,0.8);
                    border: 1px solid var(--wit-glass-border);
                    padding: 8px 16px;
                    border-radius: 999px;
                    color: var(--wit-navy);
                    font-weight: 600;
                    font-size: 13px;
                    outline: none;
                }

                .panel-body {
                    padding: 24px;
                    overflow-y: auto;
                    max-height: 600px;
                }

                /* Presence Card Styling */
                .presence-card {
                    display: flex;
                    align-items: center;
                    gap: 16px;
                    padding: 16px 0;
                    border-bottom: 1px solid rgba(255,105,180,0.1);
                }
                .presence-card:last-child { border-bottom: none; }
                .presence-avatar {
                    position: relative;
                    width: 48px;
                    height: 48px;
                    border-radius: 50%;
                    background: linear-gradient(135deg, var(--wit-pink), #ff5e8e);
                    color: white;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    font-weight: 800;
                    font-size: 16px;
                    box-shadow: 0 4px 12px rgba(255,47,138,0.3);
                }
                .presence-dot.online {
                    position: absolute;
                    bottom: 0; right: 0;
                    width: 12px; height: 12px;
                    background: #00E676;
                    border: 2px solid white;
                    border-radius: 50%;
                }
                .presence-meta {
                    flex: 1;
                    display: flex;
                    flex-direction: column;
                    gap: 4px;
                }
                .presence-name { font-weight: 700; color: var(--wit-navy); font-size: 15px; }
                .presence-page { font-size: 13px; color: var(--wit-slate); display: flex; align-items: center; gap: 4px;}
                .presence-page i { color: var(--wit-pink-soft); }
                .presence-seen {
                    background: rgba(255, 47, 138, 0.08);
                    color: var(--wit-pink);
                    padding: 4px 12px;
                    border-radius: 999px;
                    font-size: 12px;
                    font-weight: 600;
                }

                /* Activity Feed Styling */
                .activity-item {
                    position: relative;
                    display: flex;
                    gap: 20px;
                    padding-bottom: 24px;
                }
                .activity-rail {
                    position: absolute;
                    left: 20px;
                    top: 40px;
                    bottom: 0;
                    width: 2px;
                    background: rgba(183,156,255,0.2);
                }
                .activity-item:last-child .activity-rail { display: none; }
                
                .activity-icon {
                    width: 42px;
                    height: 42px;
                    border-radius: 12px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    font-size: 16px;
                    color: white;
                    z-index: 1;
                }
                
                /* Tones matching screenshot */
                .tone-slate .activity-icon { background: linear-gradient(135deg, #8A2BE2, #B79CFF); box-shadow: 0 4px 12px rgba(138,43,226,0.3); }
                .tone-green .activity-icon { background: linear-gradient(135deg, #00E676, #1DE9B6); box-shadow: 0 4px 12px rgba(0,230,118,0.3); }
                .tone-amber .activity-icon { background: linear-gradient(135deg, #FF9100, #FFD740); box-shadow: 0 4px 12px rgba(255,145,0,0.3); }
                .tone-pink .activity-icon, .tone-violet .activity-icon, .tone-blue .activity-icon { 
                    background: linear-gradient(135deg, #FF2F8A, #B79CFF); box-shadow: 0 4px 12px rgba(255,47,138,0.3); 
                }

                .activity-body {
                    flex: 1;
                    display: flex;
                    flex-direction: column;
                    gap: 6px;
                    padding-top: 4px;
                }
                .activity-name { font-weight: 700; color: var(--wit-navy); font-size: 15px; }
                .activity-desc { color: var(--wit-slate); font-size: 14px; }
                .activity-ts { color: var(--wit-slate); font-size: 12px; display: flex; align-items: center; gap: 4px; }
                .activity-time {
                    background: rgba(255, 47, 138, 0.08);
                    color: var(--wit-pink);
                    padding: 4px 12px;
                    border-radius: 999px;
                    font-size: 12px;
                    font-weight: 600;
                    height: fit-content;
                    margin-top: 4px;
                }

                .empty-feed, .empty-presence {
                    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 20px; color: var(--wit-slate);
                }
                .empty-illust { font-size: 40px; color: var(--wit-pink-soft); margin-bottom: 16px; opacity: 0.5; }
                .empty-title { font-weight: 700; font-size: 16px; color: var(--wit-navy); margin-bottom: 8px; }
                .empty-sub { font-size: 14px; }
                .live-load-more {
                    width: 100%; padding: 16px; background: rgba(255,255,255,0.6); border: 1px solid var(--wit-glass-border); border-radius: 12px; color: var(--wit-pink); font-weight: 700; cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; align-items: center; gap: 4px;
                }
                .live-load-more:hover { background: rgba(255,47,138,0.1); }
                .live-load-more em { font-size: 12px; color: var(--wit-slate); font-weight: normal; font-style: normal; }

                /* Skeleton */
                .sk-list { display: flex; flex-direction: column; gap: 20px; }
                .sk-item { display: flex; gap: 16px; }
                .sk-avatar { width: 48px; height: 48px; border-radius: 50%; background: rgba(255,105,180,0.1); animation: pulse 1.5s infinite; }
                .sk-icon { width: 42px; height: 42px; border-radius: 12px; background: rgba(255,105,180,0.1); animation: pulse 1.5s infinite; }
                .sk-body { flex: 1; display: flex; flex-direction: column; gap: 8px; justify-content: center; }
                .sk-line { height: 12px; background: rgba(255,105,180,0.1); border-radius: 6px; animation: pulse 1.5s infinite; }
                .sk-w50 { width: 50%; } .sk-w90 { width: 90%; } .sk-w30 { width: 30%; }

            </style>

            <div class="ambience-1"></div>
            <div class="ambience-2"></div>

            <header class="premium-topbar">
                <div class="premium-title">
                    <h1 id="live-header-title">Live Monitor</h1>
                    <p id="live-header-sub">Pemantauan aktivitas peserta secara real-time</p>
                </div>
                <div class="premium-admin-chip">
                    <div class="admin-info">
                        <h4 id="display-admin-name">Super Admin</h4>
                        <p id="display-admin-id">Super Admin Access</p>
                    </div>
                    <div class="avatar-pink">
                        <i class="fas fa-satellite-dish"></i>
                    </div>
                </div>
            </header>

            <div class="premium-controls">
                <div class="lm-presets" role="group" aria-label="Filter cepat tanggal">
                    <button type="button" class="lm-preset" data-preset="today"><i class="fas fa-bolt"></i> Hari Ini</button>
                    <button type="button" class="lm-preset" data-preset="7d"><i class="fas fa-calendar-week"></i> 7 Hari</button>
                    <button type="button" class="lm-preset" data-preset="30d"><i class="fas fa-calendar-days"></i> 30 Hari</button>
                    <button type="button" class="lm-preset" data-preset="month"><i class="fas fa-calendar"></i> Bulan Ini</button>
                </div>

                <div class="live-monitor-controlbar">
                    <div class="lmc-filters">
                        <div class="lmc-field">
                            <label class="lmc-label" for="live-filter-from">
                                <i class="fas fa-calendar-day"></i> Dari
                            </label>
                            <input type="date" id="live-filter-from" class="lmc-date" />
                        </div>
                        <span class="lmc-arrow"><i class="fas fa-long-arrow-alt-right"></i></span>
                        <div class="lmc-field">
                            <label class="lmc-label" for="live-filter-to">
                                <i class="fas fa-calendar-check"></i> Sampai
                            </label>
                            <input type="date" id="live-filter-to" class="lmc-date" />
                        </div>
                        <button type="button" id="live-filter-apply" class="lmc-apply">
                            <i class="fas fa-filter"></i> Filter
                        </button>
                        <button type="button" id="live-filter-reset" class="lmc-reset">
                            <i class="fas fa-rotate-left"></i> Reset
                        </button>
                    </div>
                    <div class="lmc-meta">
                        <span class="lmc-pulse" title="Sedang memantau">
                            <span class="lmc-pulse-dot"></span>
                            <span id="live-poll-status">Live</span>
                        </span>
                        <span class="lmc-count" id="live-result-count">0 aktivitas</span>
                    </div>
                </div>
            </div>

            <!-- Active filter indicator (rendered by JS) -->
            <div class="lm-active-filter" id="live-active-filter" hidden style="margin-bottom:24px; color:var(--wit-pink); font-size:14px; font-weight:600;">
                <span class="lm-active-filter-icon"><i class="fas fa-filter-circle-check"></i></span>
                <span class="lm-active-filter-text" id="live-active-filter-text"></span>
                <button type="button" class="lm-active-filter-clear btn" id="live-active-filter-clear" title="Hapus filter" style="margin-left:12px; background:white; border:none; padding:4px 12px; border-radius:999px; cursor:pointer;">
                    <i class="fas fa-xmark"></i> Hapus Filter
                </button>
            </div>

            <div class="live-monitor-grid">
                <section class="glass-panel live-online-panel">
                    <div class="panel-header">
                        <h3 class="panel-title" id="live-online-title">
                            <i class="fas fa-dot-circle icon-green"></i> Peserta Online
                        </h3>
                        <span class="live-monitor-badge" id="live-online-badge">0 online</span>
                    </div>
                    <div class="panel-body" id="live-online-presence">
                        <!-- skeleton rendered by JS -->
                    </div>
                </section>

                <section class="glass-panel live-feed-panel">
                    <div class="panel-header">
                        <h3 class="panel-title">
                            <i class="fas fa-bars-staggered icon-blue"></i> Aktivitas Terbaru
                        </h3>
                        <div class="live-feed-filter">
                            <select id="live-feed-filter-nik" class="live-filter-select" aria-label="Filter peserta">
                                <option value="">Semua Peserta</option>
                            </select>
                        </div>
                    </div>
                    <div class="panel-body" id="live-activity-feed">
                        <!-- skeleton rendered by JS -->
                    </div>
                </section>
            </div>
        </div>
    </main>
</div>
